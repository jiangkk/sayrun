name: Deploy website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - website/**
      - .github/workflows/pages.yml

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Enable Pages with GitHub Actions in repository settings before running.
    if: github.repository == 'jiangkk/sayrun' && !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
